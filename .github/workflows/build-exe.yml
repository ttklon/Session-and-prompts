name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke check (syntax)
        run: |
          python -m py_compile gui.py extractor.py db.py summarizer.py search.py semantic_search.py duplicates.py prompts.py theme.py widgets.py

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm build/genspark_arkhivator.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: genspark_arkhivator-windows
          path: dist/*.exe
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: genspark_arkhivator-windows

      - name: Create GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Genspark Arkhivator v${{ github.run_number }}
          files: "**/*.exe"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
